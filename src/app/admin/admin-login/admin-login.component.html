<div class="admin-auth-container">
  <div class="auth-card">
    <!-- Sol Taraf: Görsel / Logo Alanı -->
    <div class="auth-brand">
      <div class="brand-content">
        <img src="assets/logos/nasLogo3.png" alt="NAS Danışmanlık" class="auth-logo" />
        <h2>NAS Danışmanlık</h2>
        <p>Yönetim Paneli</p>
      </div>
      <div class="brand-overlay"></div>
    </div>

    <!-- Sağ Taraf: Form Alanı -->
    <div class="auth-form-section">
      <div class="form-header">
        <h3>Hoş Geldiniz!</h3>
        <p>Lütfen yönetici bilgilerinizi girin.</p>
      </div>

      <form (ngSubmit)="onLogin()" #loginForm="ngForm" class="login-form">
        <div class="input-group">
          <label>Kullanıcı Adı</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </span>
            <input type="text" [(ngModel)]="username" name="username" placeholder="Kullanıcı adınızı girin" required autocomplete="off" />
          </div>
        </div>

        <div class="input-group">
          <label>Şifre</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </span>
            <input type="password" [(ngModel)]="password" name="password" placeholder="Şifrenizi girin" required autocomplete="off" />
          </div>
        </div>

        <!-- Hata mesajı için uyarı alanı -->
        @if (errorMessage) {
          <div class="error-alert">
            <i class="icon-alert"></i>
            <span>{{ errorMessage }}</span>
          </div>
        }

        <button type="submit" class="btn-login" [disabled]="!loginForm.valid || isLoading">
          @if (isLoading) {
            <div class="spinner"></div>
            <span>Giriş Yapılıyor...</span>
          } @else {
            <span>Giriş Yap</span>
            <i class="icon-arrow-right"></i>
          }
        </button>
      </form>
    </div>
  </div>
</div>
